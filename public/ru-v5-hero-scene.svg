<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#020a14"/><stop offset=".34" stop-color="#06172a"/><stop offset=".64" stop-color="#0b2944"/><stop offset="1" stop-color="#102e49"/>
  </linearGradient>
  <radialGradient id="sun" cx=".955" cy=".72" r=".34">
    <stop offset="0" stop-color="#fff0bf" stop-opacity=".98"/><stop offset=".075" stop-color="#efc06b" stop-opacity=".82"/><stop offset=".21" stop-color="#bc8747" stop-opacity=".43"/><stop offset=".48" stop-color="#626f83" stop-opacity=".13"/><stop offset="1" stop-color="#061526" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="blueGlow" cx=".78" cy=".36" r=".56">
