<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#020a14"/><stop offset=".34" stop-color="#06172a"/><stop offset=".64" stop-color="#0b2944"/><stop offset="1" stop-color="#102e49"/>
  </linearGradient>
  <radialGradient id="sun" cx=".955" cy=".72" r=".34">
    <stop offset="0" stop-color="#fff0bf" stop-opacity=".98"/><stop offset=".075" stop-color="#efc06b" stop-opacity=".82"/><stop offset=".21" stop-color="#bc8747" stop-opacity=".43"/><stop offset=".48" stop-color="#626f83" stop-opacity=".13"/><stop offset="1" stop-color="#061526" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="blueGlow" cx=".78" cy=".36" r=".56">
    <stop offset="0" stop-color="#4a79a8" stop-opacity=".19"/><stop offset=".55" stop-color="#1d456a" stop-opacity=".08"/><stop offset="1" stop-color="#03101d" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#9d652a"/><stop offset=".42" stop-color="#e5b35b"/><stop offset=".68" stop-color="#fff0bc"/><stop offset="1" stop-color="#a76a2b"/>
  </linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#204b6b"/><stop offset=".44" stop-color="#0e2e49"/><stop offset="1" stop-color="#041421"/>
  </linearGradient>
  <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#203c55"/><stop offset=".34" stop-color="#10263a"/><stop offset=".66" stop-color="#081724"/><stop offset="1" stop-color="#020912"/>
  </linearGradient>
  <filter id="g1" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4.5"/></filter>
  <filter id="g2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="19"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="2" seed="9"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .032"/></feComponentTransfer></filter>
  <pattern id="lights" width="24" height="17" patternUnits="userSpaceOnUse">
    <circle cx="4" cy="5" r=".9" fill="#f7c66b" opacity=".70"/><circle cx="15" cy="13" r=".7" fill="#ffdfa0" opacity=".52"/><circle cx="22" cy="4" r=".55" fill="#dca64f" opacity=".42"/>
  </pattern>
</defs>
<rect width="1536" height="1024" fill="url(#sky)"/>
<rect width="1536" height="1024" fill="url(#blueGlow)"/>
<rect width="1536" height="1024" fill="url(#sun)"/>

<!-- accepted-reference orbital light architecture -->
